name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Moon update
        run: moon update
      - name: Moon check
        run: moon check --deny-warn --target all
      - name: Moon test
        run: moon test --target all
      - name: Format check
        run: moon fmt --check
      - name: Check standalone codegen
        run: moon -C tools/codegen check --deny-warn --target all
      - name: Test standalone codegen
        run: moon -C tools/codegen test --target all
      - name: Format standalone codegen
        run: moon -C tools/codegen fmt --check
      - name: Generate and compile Preview1 contracts on all backends
        run: bash scripts/check-codegen.sh
